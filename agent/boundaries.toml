# Boundary manifest for jankurai-tools-fleet.
# This is a single-purpose Rust workspace: the jankurai-fleet projection crate
# (fleet matrix, score diff/trend, score history, diff-audit, repair-task bank).
# Only the Rust domain block applies here; web, database, queue, and Python
# surfaces are not part of this repo. See docs/boundaries.md for prose.

[stack]
id = "rust-ts-vite-react-postgres-bounded-python"
version = "0.5.0"

[rust]
domain_paths = ["crates/jankurai-fleet/src"]
forbidden_domain_imports = [
  "std::net",
  "rand::",
  "sqlx::",
  "diesel::",
  "reqwest::",
  "rdkafka::",
  "tracing::",
  "log::"
]
