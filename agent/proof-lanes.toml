# Live minimal lane set for jankurai-tools-fleet. Every lane command runs in this
# repo alone and is mirrored by ops/ci/<lane>.sh so local and CI never drift.

[[lane]]
name = "required"
command = "bash scripts/ci-local.sh required"
purpose = "lightweight gate: resolve the workspace manifest against the locked graph"
command_id = "lane.required"
kind = "validation"
cost = 3
rules_covered = ["HLT-003-OWNERLESS-PATH", "HLT-004-UNMAPPED-PROOF"]
required_artifacts = []
timeout_seconds = 600
requires_network = false
destructive = false

[[lane]]
name = "fast"
command = "just fast"
purpose = "deterministic fast lane: cargo check + workspace tests"
command_id = "lane.fast"
kind = "validation"
cost = 5
rules_covered = ["HLT-001-DEAD-MARKER", "HLT-003-OWNERLESS-PATH", "HLT-004-UNMAPPED-PROOF", "HLT-008-FALSE-GREEN-RISK"]
required_artifacts = []
timeout_seconds = 900
requires_network = false
destructive = false

[[lane]]
name = "security"
command = "just security"
purpose = "secret scanning (gitleaks) plus dependency vulnerability scanning (cargo audit)"
command_id = "lane.security"
kind = "security"
cost = 20
rules_covered = ["HLT-009-GENERATED-SECURITY", "HLT-010-SECRET-SPRAWL", "HLT-016-SUPPLY-CHAIN-DRIFT", "HLT-020-CI-HARDENING-GAP"]
required_artifacts = ["target/jankurai/security/evidence.json"]
timeout_seconds = 1800
requires_network = false
destructive = false

[[lane]]
name = "audit"
command = "just audit"
purpose = "write .jankurai/repo-score.json and .jankurai/repo-score.md via jankurai audit"
command_id = "lane.audit"
kind = "audit"
cost = 10
rules_covered = ["HLT-001-DEAD-MARKER", "HLT-003-OWNERLESS-PATH", "HLT-004-UNMAPPED-PROOF", "HLT-008-FALSE-GREEN-RISK"]
required_artifacts = [".jankurai/repo-score.json", ".jankurai/repo-score.md"]
timeout_seconds = 900
requires_network = false
destructive = false

[[lane]]
name = "coverage-audit"
command = "cargo run -p jankurai-fleet -- coverage audit . --config agent/coverage-sources.toml --json target/jankurai/coverage/coverage-audit.json --md target/jankurai/coverage/coverage-audit.md"
purpose = "parse deterministic coverage and proof-gap artifacts without running external tools"
command_id = "lane.coverage-audit"
kind = "analysis"
cost = 8
rules_covered = ["HLT-004-UNMAPPED-PROOF", "HLT-008-FALSE-GREEN-RISK", "HLT-016-SUPPLY-CHAIN-DRIFT"]
required_artifacts = ["target/jankurai/coverage/coverage-audit.json", "target/jankurai/coverage/coverage-audit.md"]
timeout_seconds = 900
requires_network = false
destructive = false

[[lane]]
name = "copy-code"
command = "cargo run -p jankurai-fleet -- copy-code . --json target/jankurai/copy-code.json --md target/jankurai/copy-code.md"
purpose = "scan the repository for exact and high-confidence duplicated source code"
command_id = "lane.copy-code"
kind = "analysis"
cost = 12
rules_covered = ["HLT-043-COPY-PASTE-BAD-BEHAVIOR"]
required_artifacts = ["target/jankurai/copy-code.json", "target/jankurai/copy-code.md"]
timeout_seconds = 1800
requires_network = false
destructive = false

[[lane]]
name = "test-cli"
command = "cargo test --workspace --locked"
purpose = "run the Rust unit and integration test suite for the workspace"
command_id = "lane.test-cli"
kind = "validation"
cost = 8
rules_covered = ["HLT-008-FALSE-GREEN-RISK"]
required_artifacts = []
timeout_seconds = 1800
requires_network = false
destructive = false

[[lane]]
name = "full"
command = "just check"
purpose = "run format, lint, fast lane, security, and final self-audit"
command_id = "lane.full"
kind = "release"
cost = 50
supersedes = ["required", "fast", "security", "audit"]
required_artifacts = [".jankurai/repo-score.json", ".jankurai/repo-score.md", "target/jankurai/security/evidence.json"]
timeout_seconds = 3600
requires_network = false
destructive = false
