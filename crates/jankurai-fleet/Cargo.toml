[package]
name = "jankurai-fleet"
version = "0.1.0"
edition = "2021"
description = "Fleet aggregation, score diff/trend, history, diff-audit, and repair-task projections for the jankurai audit standard."
license = "MIT"
repository = "https://github.com/neverhuman/jankurai-tools-fleet"
homepage = "https://github.com/neverhuman/jankurai"
keywords = ["agent", "audit", "fleet", "history", "repair"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
jankurai-audit-kernel = { git = "https://github.com/neverhuman/jankurai-tools-kernel.git", tag = "jankurai-tools-kernel-v1.7.0-split.0", package = "jankurai-audit-kernel", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3.23"
